name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta de lectura a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY"
            exit 1
          fi
          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" --retry 3 --retry-delay 10 "$SUPABASE_URL/rest/v1/clients?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Respuesta HTTP: $status"
          if [ "$status" -ge 400 ]; then cat /tmp/resp.json; exit 1; fi
          echo "Supabase activo"
